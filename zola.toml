# Choreographr website configuration
# Relative base URL in the config; the justfile overrides it with the
# canonical URL at build time (and "/" when serving locally).
base_url = "/"
title = "Choreographr"
description = "Choreographr is an all-purpose AI agent, written in Rust, and the decentralized publishing platform it writes to. A daemon with many clients, a sandboxed RISC-V VM, 200+ model providers, and built-in access to the Choreographr publishing platform."
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = true

# Build into docs/ — committed to the repo and served by GitHub Pages
# (Settings → Pages → Deploy from a branch → master /docs).
output_dir = "docs"

# Exclude /blog/page/N and /blog/tags/*/page/N pagination URLs from the
# sitemap (they duplicate the canonical list pages). The custom
# templates/sitemap.xml additionally filters /search/ and thin taxonomy
# listing pages.
exclude_paginated_pages_in_sitemap = "all"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Taxonomy URLs live under /blog/ (e.g. /blog/tags/rust/). This is the
# documented replacement for the old per-taxonomy `path` key, which Zola
# silently ignored (the tags previously ended up at /tag/).
taxonomy_root = "blog"

[markdown]
# Deep-linkable heading anchors (🔗 after each heading, shown on hover).
insert_anchor_links = "right"
# GitHub-style callouts in docs/blog: > [!NOTE], > [!WARNING], ...
github_alerts = true
# External markdown links open in a new tab, like the navbar/footer ones.
external_links_target_blank = true
# Lazy-load the site's raster images (me.jpg on the consulting page).
lazy_async_image = true

[markdown.highlighting]
theme = "catppuccin-mocha"
# Fail the build on a mistyped code-fence language instead of silently
# rendering it unhighlighted.
error_on_missing_language = true

[link_checker]
# Skip external-link checking for URLs that start with these prefixes.
# These are historical references from the original MIX/LINK era that remain
# as authentic citations: the archived Medium blog posts (Medium blocks the
# automated checker) and the moved Polkadot SDK URL. They are not live
# mistakes, so don't fail `zola check` on them.
skip_prefixes = [
  "https://medium.com/mix-blockchain/",
  "https://polkadot.com/platform/sdk/",
]

[[taxonomies]]
name = "tags"
paginate_by = 10
feed = true

# Blog authorship. Terms are author display names (e.g. "Jonathan Brown")
# slugified to "jonathan-brown"; rich profiles live in data/authors.toml and
# are looked up by slug from the author templates.
[[taxonomies]]
name = "authors"

[search]
# The official search.js snippet loads the JSON format.
# Zola auto-copies elasticlunr.min.js to the output root.
index_format = "elasticlunr_json"

[extra]
# Community / project links
github = "https://github.com/choreographr/choreographr"
telegram = "https://t.me/choreographr"
license = "Apache-2.0"
msrv = "1.94.1"
# Total built-in tools registered by the release daemon (see the
# ToolRegistry in choreo-daemon/src/tools/mod.rs).
tool_count = 75

# Navigation — items are shown on the right of the navbar.
# `href` is a site-relative path.
nav = [
  { name = "Agent", href = "/agent/" },
  { name = "Platform", href = "/platform/" },
  { name = "Blog", href = "/blog/" },
  { name = "Consulting", href = "/consulting/" },
  { name = "GitHub", href = "https://github.com/choreographr/choreographr", external = true },
  { name = "Telegram", href = "https://t.me/choreographr", external = true },
]
