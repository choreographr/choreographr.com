<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="theme-color" content="#06080b">

  <!-- Critical inline CSS: paint the dark theme immediately, before
       main.css (or the webfont stylesheet) finishes loading, so the
       page never flashes white on navigation. -->
  <style>
    html { background-color: #06080b; color-scheme: dark; }
    body { background-color: #06080b; color: #d3dae3; }
  </style>

  <!-- Self-hosted fonts (same-origin): preload the two variable woff2
       files so they're available at first paint — no visible swap. -->
  <link rel="preload" href="{{ get_url(path='fonts/inter.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/jetbrains-mono.woff2') }}" as="font" type="font/woff2" crossorigin>

  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}">
  <link rel="stylesheet" href="{{ get_url(path='css/main.css') }}">

  {% if config.generate_feed %}
  <link rel="alternate" type="application/atom+xml" title="Choreographr Blog" href="{{ get_url(path='atom.xml', trailing_slash=false) | safe }}">
  {% endif %}

  {% block extra_head %}{% endblock extra_head %}
</head>
<body class="min-h-screen flex flex-col">

  {% include "partials/nav.html" %}

  <main class="flex-1">
    {% block content %}{% endblock content %}
  </main>

  {% include "partials/footer.html" %}

  {% block extra_js %}{% endblock extra_js %}
</body>
</html>
