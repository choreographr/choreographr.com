<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}">
  <link rel="stylesheet" href="{{ get_url(path='css/main.css') }}">

  {% if config.generate_feed %}
  <link rel="alternate" type="application/atom+xml" title="Choreographr Blog" href="{{ get_url(path='atom.xml', trailing_slash=false) | safe }}">
  {% endif %}

  {% block extra_head %}{% endblock extra_head %}
</head>
<body class="min-h-screen flex flex-col">

  {% include "partials/nav.html" %}

  <main class="flex-1">
    {% block content %}{% endblock content %}
  </main>

  {% include "partials/footer.html" %}

  {% block extra_js %}{% endblock extra_js %}
</body>
</html>
