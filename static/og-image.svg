      <stop offset="0" stop-color="#dea584" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#dea584" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#06080b"/>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- accent bar -->
  <rect x="80" y="120" width="72" height="6" rx="3" fill="#dea584"/>

  <!-- wordmark -->
